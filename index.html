<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonoMood | Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <span>☁️</span>
            <h1>MonoMood</h1>
        </div>

        <p class="tagline">
            Understand your mood.<br>
            Embrace your moment.
        </p>

        <div class="login-card">

            <h2>Welcome Back 👋</h2>
            <p class="subtitle">Login to continue your mood journey</p>

            <form id="loginForm">

                <label>Email</label>
                <input 
                    type="email" 
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>
                <input 
                    type="password" 
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">Login</button>

            </form>

            <p class="signup-text">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>

        </div>

        <p class="footer-text">
            Your mood matters 💜
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
