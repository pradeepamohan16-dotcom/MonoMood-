<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonoMood | Create Account</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <span>☁️</span>
            <h1>MonoMood</h1>
        </div>

        <p class="tagline">
            Start your personal mood journey 💜
        </p>

        <div class="login-card">

            <h2>Create Account ✨</h2>
            <p class="subtitle">Let's get to know you</p>

            <form id="signupForm">

                <label>Full Name</label>
                <input 
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

                <label>Email</label>
                <input 
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>
                <input 
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    required
                >

                <label>Confirm Password</label>
                <input 
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

                <button type="submit">Create Account</button>

            </form>

            <p class="signup-text">
                Already have an account?
                <a href="index.html">Login</a>
            </p>

        </div>

        <p class="footer-text">
            Your mood matters 💜
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
